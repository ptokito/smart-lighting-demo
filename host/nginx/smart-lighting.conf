# =============================================================================
# NGINX reverse proxy on the host VM: the public front door.
#
# Template: scripts/host-bootstrap.sh replaces ${K3S_IP} with the k3s node's
# private IP before installing it as /etc/nginx/sites-available/smart-lighting.
#
# Traffic path: internet -> NGINX :80 (this VM) -> portal NodePort 30080 on
# the k3s node -> lighting-api -> device-gateway / crew-dispatch.
# =============================================================================

upstream lighting_portal {
    server ${K3S_IP}:30080;
    keepalive 16;
}

# Access log format that includes request time and upstream response time, so
# log lines in New Relic and CloudWatch show how long each request took.
log_format timed '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log timed;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://lighting_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Longer than the slowest legitimate request (an 8 s acknowledgement).
        proxy_read_timeout 30s;
    }
}

# Status page for the New Relic NGINX integration. Listens on localhost only,
# so it is never reachable from outside the VM.
server {
    listen 127.0.0.1:8080;
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
